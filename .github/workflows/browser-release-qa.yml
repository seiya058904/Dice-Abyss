name: Independent browser release QA

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
  workflow_dispatch:
  # Called by pages.yml so a main-push deploy can require the exact same
  # commit's two-mode browser gate instead of reusing another SHA's green run.
  workflow_call:

permissions:
  contents: read

jobs:
  # One exact-HEAD gate split into parallel shards. Together they run
  # every check of the former sequential job: native core checks, the
  # API-absent Web Locks mode, and the native pace combinations.
  browser-release:
    name: browser-release (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: native
            args: --suite=core
          - shard: api-absent
            args: --suite=core --no-web-locks=true
          - shard: pace-full
            args: --suite=pace --pace-group=full
          - shard: pace-low
            args: --suite=pace --pace-group=low
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert event head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD=$(git rev-parse HEAD)
          printf '{"expected":"%s","actual":"%s"}\n' "$EXPECTED_HEAD" "$ACTUAL_HEAD" > "$RUNNER_TEMP/head-identity.json"
          test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated pinned QA browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false playwright@1.60.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: HTTP shipping manifest
        if: matrix.shard == 'native'
        run: node scripts/smoke-http.mjs --output "$RUNNER_TEMP/http-smoke.json"
      - name: Exact HEAD staged-site browser gate (${{ matrix.shard }})
        shell: bash
        run: |
          set -o pipefail
          node scripts/qa-browser-release.mjs ${{ matrix.args }} --output="$RUNNER_TEMP/browser-release" 2>&1 | tee "$RUNNER_TEMP/browser-release.log"
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-release
            ${{ runner.temp }}/browser-release.log
            ${{ runner.temp }}/head-identity.json
            ${{ runner.temp }}/http-smoke.json
          if-no-files-found: ignore
          retention-days: 14
