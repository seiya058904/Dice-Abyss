<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Dice Abyss</title>
  <desc id="d">Two fate dice above a six-room route, drawn in cyan and gold on a near-black field. An illustration based on the game's floor structure, not a screenshot.</desc>
  <rect width="1200" height="320" fill="#0a0d11"/>
  <g fill="none" stroke="#17313a" stroke-width="2">
    <ellipse cx="860" cy="196" rx="300" ry="62"/>
    <ellipse cx="860" cy="196" rx="214" ry="40"/>
  </g>
  <path d="M0 304H1200" stroke="#17313a" stroke-width="2"/>
  <text x="56" y="152" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="76" font-weight="700" letter-spacing="3" fill="#e9eef2">DICE ABYSS</text>
  <text x="58" y="214" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="38" fill="#4fd1d6">Roll. Build. Descend.</text>
  <rect x="58" y="244" width="120" height="6" fill="#e0a93b"/>

  <!-- Fate die A -->
  <g>
    <polygon points="760,18 828,57 760,96 692,57" fill="#2d6f76"/>
    <polygon points="692,57 760,96 760,174 692,135" fill="#12242b" stroke="#4fd1d6" stroke-width="2"/>
    <polygon points="760,96 828,57 828,135 760,174" fill="#0d1a20" stroke="#4fd1d6" stroke-width="2"/>
    <g transform="matrix(68 39 0 78 692 57)" fill="#e9eef2">
      <circle cx=".28" cy=".28" r=".07"/><circle cx=".72" cy=".28" r=".07"/><circle cx=".28" cy=".72" r=".07"/><circle cx=".72" cy=".72" r=".07"/>
    </g>
    <g transform="matrix(68 -39 0 78 760 96)" fill="#e9eef2">
      <circle cx=".28" cy=".28" r=".07"/><circle cx=".5" cy=".5" r=".07"/><circle cx=".72" cy=".72" r=".07"/>
    </g>
  </g>
  <!-- Fate die B -->
  <g>
    <polygon points="960,34 1028,73 960,112 892,73" fill="#d8a43a"/>
    <polygon points="892,73 960,112 960,190 892,151" fill="#241c0c" stroke="#e0a93b" stroke-width="2"/>
    <polygon points="960,112 1028,73 1028,151 960,190" fill="#1a1409" stroke="#e0a93b" stroke-width="2"/>
    <g transform="matrix(68 39 0 78 892 73)" fill="#f4e2b4">
      <circle cx=".3" cy=".3" r=".07"/><circle cx=".7" cy=".7" r=".07"/>
    </g>
    <g transform="matrix(68 -39 0 78 960 112)" fill="#f4e2b4">
      <circle cx=".28" cy=".28" r=".07"/><circle cx=".72" cy=".28" r=".07"/><circle cx=".5" cy=".5" r=".07"/><circle cx=".28" cy=".72" r=".07"/><circle cx=".72" cy=".72" r=".07"/>
    </g>
  </g>

  <!-- Six-room route -->
  <path d="M640 268H1120" stroke="#3a5a63" stroke-width="3"/>
  <g stroke="#4fd1d6" stroke-width="3" fill="#0a0d11">
    <circle cx="640" cy="268" r="16" stroke="#e0556a"/>
    <circle cx="736" cy="268" r="16"/>
    <circle cx="832" cy="268" r="16"/>
    <circle cx="928" cy="268" r="16"/>
    <circle cx="1024" cy="268" r="16"/>
    <circle cx="1120" cy="268" r="16" stroke="#e0a93b"/>
  </g>
  <g stroke="#e9eef2" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M634 275l12-14"/>
    <path d="M730 275l12-14"/>
    <path d="M825 276h14l-7-14z"/>
    <path d="M922 275l12-14"/>
    <rect x="1017" y="262" width="14" height="12"/>
    <path d="M1120 258l9 10-9 10-9-10z"/>
  </g>
</svg>
