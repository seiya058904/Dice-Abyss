<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Dice Abyss — Roll your fate</title>
  <desc id="desc">An original charcoal and antique-gold banner with a three-dimensional six-sided die, celestial orbit engravings, and the words Roll Your Fate.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111319"/>
      <stop offset="0.47" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="aura" cx="74%" cy="51%" r="55%">
      <stop offset="0" stop-color="#805c2d" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#3d2942" stop-opacity=".19"/>
      <stop offset="1" stop-color="#07090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae6b4"/>
      <stop offset=".42" stop-color="#dfbd77"/>
      <stop offset="1" stop-color="#a47e43"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#424049"/>
      <stop offset="1" stop-color="#242631"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292a33"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161820"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="dieShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="19" stdDeviation="19" flood-color="#000000" flood-opacity=".75"/>
    </filter>
    <pattern id="grating" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#b2a084" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="500" fill="url(#night)"/>
  <rect width="1400" height="500" fill="url(#aura)"/>
  <rect width="1400" height="500" fill="url(#grating)"/>
  <path d="M0 418 L530 0 M0 460 L600 0 M800 500 L1400 100 M960 500 L1400 210" stroke="#d9b477" stroke-opacity=".045" stroke-width="1"/>
  <rect x="20" y="20" width="1360" height="460" rx="2" fill="none" stroke="#6a624f" stroke-opacity=".56" stroke-width="1"/>
  <path d="M44 44h58M44 44v58M1356 44h-58M1356 44v58M44 456h58M44 456v-58M1356 456h-58M1356 456v-58" fill="none" stroke="#dfbd77" stroke-opacity=".55" stroke-width="1.6"/>

  <!-- Editorial left column. -->
  <path d="M100 99h46m-23-23v46" stroke="#dfbd77" stroke-width="1.4" stroke-opacity=".7"/>
  <circle cx="123" cy="99" r="7" fill="none" stroke="#dfbd77" stroke-opacity=".65"/>
  <text x="171" y="105" fill="#b5aa98" font-family="Consolas, 'Courier New', monospace" letter-spacing="4.6" font-size="19">THE ABYSS AWAITS</text>
  <path d="M101 140h515" stroke="#655a49" stroke-opacity=".78" stroke-width="1"/>
  <text x="96" y="253" fill="#f1eee8" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="bold" letter-spacing="3">ROLL YOUR</text>
  <text x="98" y="352" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="103" font-weight="bold" letter-spacing="5">FATE.</text>
  <path d="M102 387h90" stroke="#dfbd77" stroke-width="2"/>
  <text x="210" y="393" fill="#bbb7b2" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="1.55">SIX ROOMS. ONE WAY DOWN.</text>

  <!-- An engraved orbital map behind the die. -->
  <circle cx="1028" cy="250" r="204" fill="none" stroke="#dfbd77" stroke-opacity=".23" stroke-width="1"/>
  <circle cx="1028" cy="250" r="170" fill="none" stroke="#b9a889" stroke-opacity=".19" stroke-width="1" stroke-dasharray="3 12"/>
  <circle cx="1028" cy="250" r="147" fill="none" stroke="#dfbd77" stroke-opacity=".2" stroke-width="1"/>
  <circle cx="1028" cy="250" r="222" fill="none" stroke="#c69cf4" stroke-opacity=".075" stroke-width="1" stroke-dasharray="60 23 3 23"/>
  <path d="M1028 34V80M1028 420v46M811 250h54M1197 250h53" stroke="#dfbd77" stroke-opacity=".43" stroke-width="1.2"/>
  <path d="M1028 41l6 9-6 9-6-9Zm0 400 6 9-6 9-6-9ZM819 250l9 6 9-6-9-6ZM1219 250l9 6 9-6-9-6Z" fill="#dfbd77" opacity=".68"/>
  <ellipse cx="1028" cy="345" rx="137" ry="33" fill="#c29a5b" opacity=".12" filter="url(#blur)"/>
  <path d="M785 250h67M1200 250h46" stroke="#bd9b63" opacity=".2"/>

  <!-- A die made of three carefully shaded faces, with engraved pips. -->
  <g filter="url(#dieShadow)">
    <path d="M1028 111 L1159 182 L1028 256 L897 182Z" fill="url(#top)" stroke="#bba77e" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M897 182 L1028 256 L1028 398 L897 321Z" fill="url(#left)" stroke="#ab966d" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M1159 182 L1028 256 L1028 398 L1159 321Z" fill="url(#right)" stroke="#a18e68" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M1028 123 L1143 185 L1028 248 L913 185Z" stroke="#bca77b" stroke-opacity=".21" fill="none"/>
    <path d="M908 197L1020 261v119l-112-66Z" stroke="#c5ac79" stroke-opacity=".19" fill="none"/>
    <path d="M1148 197L1038 261v119l110-66Z" stroke="#c5ac79" stroke-opacity=".16" fill="none"/>
    <g fill="#e5c995" opacity=".95">
      <ellipse cx="1028" cy="182" rx="10" ry="7"/>
      <ellipse cx="970" cy="181" rx="9" ry="5.8"/>
      <ellipse cx="1086" cy="182" rx="9" ry="5.8"/>
    </g>
    <g fill="#cfb57d">
      <ellipse cx="932" cy="221" rx="7.5" ry="8.4"/>
      <ellipse cx="993" cy="348" rx="7.6" ry="8.5"/>
      <ellipse cx="963" cy="285" rx="7.6" ry="8.5"/>
    </g>
    <g fill="#e4c68a">
      <ellipse cx="1060" cy="275" rx="7.2" ry="8.1"/>
      <ellipse cx="1125" cy="235" rx="7.2" ry="8.1"/>
      <ellipse cx="1093" cy="294" rx="7.2" ry="8.1"/>
      <ellipse cx="1060" cy="347" rx="7.2" ry="8.1"/>
      <ellipse cx="1125" cy="310" rx="7.2" ry="8.1"/>
    </g>
    <path d="M1028 111v145M897 182l131 74 131-74" fill="none" stroke="#fff0c2" stroke-opacity=".16"/>
  </g>
  <!-- Tiny gilded stars around the orbit, kept secondary to the die. -->
  <g stroke="#dfbd77" stroke-opacity=".61" fill="none" stroke-width="1.4">
    <path d="M808 99v14m-7-7h14M1244 360v16m-8-8h16M1227 93v10m-5-5h10M811 396v9m-5-4.5h10"/>
  </g>
  <g fill="#dfbd77" opacity=".56"><circle cx="1272" cy="172" r="2"/><circle cx="790" cy="313" r="2"/><circle cx="879" cy="61" r="2"/><circle cx="1214" cy="430" r="2"/></g>

  <!-- Bottom signature line. -->
  <path d="M102 432H710" stroke="#4c4439" stroke-width="1"/>
  <text x="102" y="457" fill="#86817c" font-family="Consolas, 'Courier New', monospace" letter-spacing="2.8" font-size="12">DICE ABYSS  /  DARK-FANTASY DUNGEON RPG</text>
  <text x="1294" y="456" fill="#dfbd77" font-family="Consolas, 'Courier New', monospace" letter-spacing="2.1" font-size="12" text-anchor="end">01 / ∞</text>
</svg>